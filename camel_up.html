<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>낙타 레이스 — Camel Up 2판 규칙</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#FBE7B5; --sand-deep:#F4C978; --night:#3B2A6A; --night-soft:#5A4691; --paper:#FFF8E8;
  --ok:#3FA86B; --warn:#E05A5A;
  --red:#FF6B6B; --blue:#4D8DFF; --green:#4CC46A; --yellow:#FFCF3F; --purple:#B07CFF; --black:#4A4A55; --white:#F4F1EA;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:pan-y;overscroll-behavior-y:none}
body{-webkit-text-size-adjust:100%}
input,textarea{font-size:16px}
body{font-family:"Nunito","Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--night);
  background:radial-gradient(circle at 20% -10%,#FFF3D1 0,var(--sand) 45%,var(--sand-deep) 100%);min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 14px calc(160px + env(safe-area-inset-bottom))}
h1{font-weight:900;font-size:36px;letter-spacing:-1px;line-height:1;text-align:center}
h2{font-weight:900;font-size:24px;text-align:center;margin:6px 0 14px}
p.sub{text-align:center;color:var(--night-soft);font-weight:600;margin-bottom:16px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;font-weight:800;color:inherit}
.btn{display:block;width:100%;padding:15px 18px;border-radius:var(--radius);background:var(--night);color:#fff;font-size:17px;
  box-shadow:0 6px 0 #241850;transition:transform .08s,box-shadow .08s;margin-bottom:12px;text-align:left}
.btn small{display:block;font-weight:600;font-size:13px;opacity:.8;margin-top:3px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #241850}
.btn.light{background:var(--paper);color:var(--night);box-shadow:0 6px 0 #E4CFA2}
.btn.light:active{box-shadow:0 2px 0 #E4CFA2}
.btn.ghost{background:transparent;box-shadow:none;color:var(--night-soft);text-align:center;padding:10px}
.btn:disabled{opacity:.4;transform:none}
.btn.center{text-align:center}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:14px;box-shadow:0 4px 0 #E4CFA2;margin:0}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{padding:14px 0;border-radius:18px;background:var(--paper);font-size:22px;font-weight:900;text-align:center;box-shadow:0 5px 0 #E4CFA2}
.pill.sel{background:var(--night);color:#fff;box-shadow:0 5px 0 #241850}
input{font:inherit;font-weight:700;width:100%;padding:14px 16px;border-radius:18px;border:3px solid transparent;background:var(--paper);color:var(--night);outline:0;margin-bottom:10px}
input:focus{border-color:var(--night-soft)}
input.code{font-size:28px;letter-spacing:6px;text-align:center;text-transform:uppercase;font-weight:900}
.card{background:var(--paper);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 0 #EAD6A8}
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:18px;padding:8px 12px;margin-bottom:8px;font-weight:900;font-size:15px}
.tipbtn{width:36px;height:36px;border-radius:50%;background:var(--sand-deep);font-size:18px}
/* 플레이어 순서/코인 스트립 */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.seat{flex:0 0 auto;background:var(--paper);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:800;border:3px solid transparent;min-width:72px;text-align:center;line-height:1.3}
.seat.now{border-color:var(--night);background:#FFEAA8}
.seat.me{box-shadow:0 0 0 2px #B07CFF inset}
.seat .n{font-size:10px;color:var(--night-soft)}
.seat .c{font-size:15px;color:#C98700;font-weight:900}
/* 트랙 — 사각 둘레형(부루마블) 순환 트랙. 칸/낙타 좌표는 layoutTrack()이 컨테이너 너비로 계산 */
.track{position:relative;background:#FFF1CF;border-radius:var(--radius);margin-bottom:10px;border:4px solid #F1D9A2;overflow:visible}
.cell{position:absolute;border-radius:12px;background:#F8E2AE;border:2px solid #E9CD93;font-size:11px;font-weight:900;color:#B08A47;padding:3px 6px;line-height:1}
.cell.corner{background:#F3D79A}
.arrow{position:absolute;font-size:14px;color:#C9A45C;font-weight:900;line-height:1;pointer-events:none}
.cell.tile-cheer,.cell.tile-boo{border-style:dashed;border-width:3px;border-color:var(--ok)}
.cell.tile-boo{border-color:var(--warn)}
.cell .tilelabel{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;font-size:10px;font-weight:900;color:#fff;
  background:var(--ok);border-radius:999px;padding:2px 6px;line-height:1.2;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;z-index:5}
.cell.tile-boo .tilelabel{background:var(--warn)}
.cell .tilelabel em{font-style:normal;font-size:11px}
.cell.pick{outline:3px solid var(--night);cursor:pointer;background:#FFEAA8;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:#B07CFF}}
.zone{position:absolute;border-radius:14px;font-size:11px;font-weight:800;color:#B08A47;text-align:center;padding:3px 0}
.zone.start{background:#F3D79A;border:2px dashed #C9A45C}
.zone.fin{color:var(--night)}
.finishline{position:absolute;background:repeating-linear-gradient(0deg,#3B2A6A 0 6px,#fff 6px 12px);border-radius:3px;z-index:2}
.camels{position:absolute;inset:0;pointer-events:none;z-index:3}
.camel{position:absolute;width:42px;height:31px;left:0;top:0;transition:transform .8s cubic-bezier(.35,1.35,.45,1);will-change:transform;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.camel svg{width:100%;height:100%;overflow:visible}
.camel.flip svg{transform:scaleX(-1)}
.camel .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
.camel.moving svg{animation:hop .35s ease-in-out 3}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{50%{transform:translateY(-7px)}}
.camel.flip.moving svg{animation:hopflip .35s ease-in-out 3}
@keyframes hopflip{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.camel{transition:none}.camel svg,.camel .eye{animation:none!important}}
/* 순위, 주사위 */
.rank{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;border:2px solid rgba(0,0,0,.15)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.dice{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.die{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;border:2px solid rgba(0,0,0,.15)}
.die.unused{opacity:.3;font-size:0}
.pyramid{text-align:center;margin:8px 0}
.pyramid.shake{animation:shake .6s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}}
/* 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(59,42,106,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:28px;padding:20px;max-height:85dvh;overflow:auto;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:10px}
.sheet.tip{max-height:80dvh;display:flex;flex-direction:column}
.tipbody{overflow:auto;flex:1;min-height:0;font-weight:600;line-height:1.55;margin-bottom:12px;padding-right:4px}
.tipbody p{margin-bottom:8px}.tipbody h4{font-size:15px;font-weight:900;margin:12px 0 6px}
.tipbody ol,.tipbody ul{padding-left:20px;margin-bottom:8px}.tipbody li{margin-bottom:4px}
.tipbody blockquote{background:#FFF1CF;border-left:4px solid var(--sand-deep);border-radius:8px;padding:8px 10px;margin:6px 0 10px}
.sheet p{font-weight:600;line-height:1.5;margin-bottom:10px}
.pass{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.pass .big{font-size:80px;margin-bottom:10px}
.coin{color:#C98700;font-weight:900}
.log{font-size:13px;font-weight:700;color:var(--night-soft);max-height:70px;overflow:auto;line-height:1.5}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sand-deep);font-weight:800}
.bets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.betbtn{padding:8px 2px 6px;border-radius:14px;color:#fff;font-weight:900;font-size:12px;text-align:center;border:3px solid rgba(0,0,0,.12)}
.betbtn svg{width:40px;height:30px;overflow:visible;display:block;margin:0 auto 2px}
.betbtn small{display:block;font-size:11px;font-weight:800}
.betbtn:disabled{opacity:.3}
.hero{position:relative;height:160px;margin:6px 0 16px}
.hero .camel{width:96px;height:72px;animation:idle 2.2s ease-in-out infinite;transition:none}
@keyframes idle{50%{margin-top:-8px}}
.testline{font-size:13px;font-weight:700;padding:4px 0;border-bottom:1px dashed #EAD6A8}
.ok{color:var(--ok)}.bad{color:var(--warn)}
.name{font-weight:900}
.mine{border:3px solid var(--night)}
.codebox{font-size:44px;font-weight:900;letter-spacing:8px;text-align:center;background:var(--night);color:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px}
.lobby-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #EAD6A8;font-weight:800}
.timerbar{display:flex;justify-content:center;margin-bottom:8px}
.timer{display:inline-block;background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;min-width:150px;text-align:center}
.timer.warn{background:var(--warn);color:#fff;animation:blinkbg .5s steps(2,start) infinite}
@keyframes blinkbg{to{background:#8f2e2e}}
.sync{font-size:12px;color:var(--night-soft);font-weight:700;text-align:center;margin-bottom:8px}
.wait{text-align:center;padding:10px;font-weight:800}
.spin{display:inline-block;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stats div{background:var(--night);color:#fff;border-radius:16px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.stats span{font-size:11px;font-weight:700;opacity:.8}
.card.hist{padding:12px 14px}
.card.hist.won{background:linear-gradient(135deg,#FFF3B0,#FFD86B);box-shadow:0 4px 0 #D9A420;border:2px solid #F2C14E}
.hist-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:6px}
.hist-date{font-size:11px;font-weight:700;color:var(--night-soft)}
.hist-row{display:flex;justify-content:space-between;padding:4px 0;font-weight:700;font-size:14px;border-top:1px dashed rgba(0,0,0,.08)}
.hist-row.me{font-weight:900;background:rgba(255,255,255,.45);border-radius:8px;padding:4px 6px}
.chat{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:31}
.chat-btn{position:relative;width:46px;height:46px;border-radius:50%;background:var(--night-soft);color:#fff;font-size:20px;box-shadow:0 4px 0 #3B2A6A}
.chat-badge{position:absolute;top:-4px;right:-4px;background:var(--warn);color:#fff;font-size:11px;font-weight:900;border-radius:999px;min-width:20px;height:20px;line-height:20px;padding:0 5px}
.chat-panel{display:none;position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;height:min(60dvh,460px);background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(59,42,106,.3);flex-direction:column;z-index:32;padding-bottom:env(safe-area-inset-bottom)}
.chat-panel.open{display:flex}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;font-size:16px}
.chat-close{background:transparent;font-size:18px;padding:4px 8px;color:var(--night-soft)}
.chat-list{flex:1;overflow:auto;padding:4px 14px}
.chat-empty{text-align:center;color:var(--night-soft);font-weight:700;padding:30px 0;font-size:13px}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:8px}
.msg.me{align-items:flex-end}
.msg .who{font-size:11px;font-weight:800;color:var(--night-soft);margin-bottom:2px}.msg .who span{font-weight:600;opacity:.7;margin-left:4px}
.msg .bubble{max-width:78%;background:#fff;border-radius:14px 14px 14px 4px;padding:7px 11px;font-weight:700;font-size:14px;line-height:1.4;word-break:break-word;box-shadow:0 2px 0 #EAD6A8}
.msg.me .bubble{background:var(--night);color:#fff;border-radius:14px 14px 4px 14px;box-shadow:0 2px 0 #241850}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{flex:0 0 auto;background:#F3E4BF;border-radius:999px;padding:6px 12px;font-size:14px}
.chat-input{display:flex;gap:8px;padding:6px 12px 12px}
.chat-input input{margin:0;flex:1;padding:11px 14px;border-radius:14px}
.chat-send{background:var(--night);color:#fff;border-radius:14px;padding:0 16px;box-shadow:0 4px 0 #241850}
.bgm{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.bgm-btn{width:46px;height:46px;border-radius:50%;background:var(--night);color:#fff;font-size:20px;box-shadow:0 4px 0 #241850}
.bgm-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #241850}
.bgm-panel{display:none;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(59,42,106,.25);width:220px;font-weight:800}
.bgm-panel.open{display:block}
.bgm-panel input[type=range]{width:100%;margin:10px 0;padding:0;background:transparent;accent-color:var(--night)}
.bgm-panel .btn{width:100%;text-align:center}
.set-card{padding:12px 16px}
.set-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pencil{width:34px;height:34px;border-radius:50%;background:var(--sand-deep);font-size:16px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px dashed #EAD6A8;font-size:13px;font-weight:700;color:var(--night-soft)}
.set-row b{color:var(--night);font-weight:900;text-align:right}
.set-item{margin-bottom:10px}.set-label{font-weight:900;font-size:14px;margin-bottom:6px}
.set-hint{font-size:11px;font-weight:700;color:var(--night-soft);margin:-4px 0 12px}
.pname{display:inline}.ptitle{font-size:.85em;font-weight:900;color:var(--night-soft);opacity:.9}
.pcard{padding:12px 16px}.pcard-name{font-size:20px}.pcard-sub{font-weight:800;font-size:13px;margin-top:2px}.pcard-hint{font-size:12px;font-weight:700;color:var(--night-soft);margin-top:6px}.pcard-hint .btn{display:inline-block;width:auto;vertical-align:middle}
.profile{padding:10px 16px}.prow{display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #EAD6A8}
.plabel{font-size:12px;font-weight:800;color:var(--night-soft)}.pval{font-size:17px;font-weight:900}
.tcard{background:#E9E4DA;border-radius:16px;padding:10px 12px;margin-bottom:8px;border:3px solid transparent;color:#6B6B6B}
.tcard.earned{background:#FFE58A;color:var(--night);cursor:pointer}.tcard.sel{border-color:#3B82F6}
.tcard-head{display:flex;justify-content:space-between;font-size:14px}.tcard-head span{font-size:11px;font-weight:800}
.tcard-desc{font-size:12px;font-weight:600;margin-top:2px}.tcard-prog{font-size:12px;font-weight:900;margin-top:4px}
.growth{border:3px solid var(--night)}.growth-row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #EAD6A8;font-weight:700}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--warn);color:#fff}
.tierbar{height:10px;background:#EFE3C6;border-radius:999px;margin-top:10px;overflow:hidden}.tierfill{height:100%;border-radius:999px}
.tier-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:8px;border:3px solid transparent}.tier-row.cur{background:#FFF1CF}
.hist-pred{font-size:12px;font-weight:800;margin-top:6px}
.rptable-wrap{overflow-x:auto;margin-top:8px}.rptable{border-collapse:collapse;font-size:12px;font-weight:800;white-space:nowrap}
.rptable th,.rptable td{padding:5px 7px;text-align:center;border-bottom:1px dashed #EAD6A8}.rptable th{color:var(--night-soft);font-size:11px}
.rptable td.pos{color:var(--ok)}.rptable td.neg{color:var(--warn)}
.toggle{display:flex;gap:6px}.toggle button{flex:1;padding:10px;border-radius:12px;background:#EFE3C6}.toggle button.sel{background:var(--night);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   1. 규칙 설정 — 게임 규칙(GAME_RULES)과 인원별 설정 분리. 하드코딩 금지 영역.
   ===================================================================== */
const APP_VERSION = 'v21 · 2026-09-14';
const GAME_RULES = {
  EDITION: 'Camel Up 2nd Edition (2018)',
  TRACK_LENGTH: 16,
  RACING_CAMELS: ['red','blue','green','yellow','purple'],
  CRAZY_CAMELS: ['black','white'],
  DIE_FACES: [1,2,3],
  // ADR-003(사용자 결정): 피라미드의 주사위 6개를 모두 공개해야 구간 종료. 공식 2판은 5개 공개(1개 남김). 설정에서 전환.
  DICE_DRAWN_PER_LEG: 6,
  PYRAMID_TICKET_COIN: 1,
  LEG_BET_TICKETS: [5,3,2,2],
  LEG_BET_SECOND_PLACE: 1,
  LEG_BET_WRONG: -1,
  FINAL_BET_PAYOUT: [8,5,3,2,1,1,1,1],
  FINAL_BET_WRONG: -1,
  SPECTATOR_TILE_COIN: 1,
  SPECTATOR_TILE_FORBIDDEN: [1],
  SPECTATOR_TILE_NO_ADJACENT: true,
  MIN_COINS: 0,
  // ADR-001(사용자 결정): 'start' = 모든 낙타가 출발 구역(0번, 트랙 밖)에 나란히 대기. 겹치지 않음.
  //   출발 구역에서는 스택이 없고, 첫 이동 시 일반 낙타는 1~3번, 미친 낙타는 뒤로 돌아 16~14번으로 진입.
  //   공식 규칙은 'dice'(주사위로 1~3 / 16~14에 미리 배치). 설정 화면에서 전환 가능.
  // 시작 위치·구간 종료 시점·플레이 순서·LEG 시작 순서·타이머·파트너십은 판마다 정함 → GAME_SETTING_DEFAULTS 참고
  START_ZONE: 0,                      // 출발 구역 번호
  CRAZY_WRAP: true,                   // 미친 낙타가 출발선을 뒤로 넘으면 16번으로 이어짐 (OPEN-002)
  MAX_PLAYERS: 8,                     // 공식 2판: 3~8인
  PARTNERSHIP_MIN_PLAYERS: 6,         // 베팅 파트너십(공식 선택 규칙)은 6인 이상에서만
  TURN_TIMER_SECONDS: 30,             // 턴 타이머 기본값 — 만료 시 강제로 주사위 뽑기(코인 보상 없음)
  TURN_TIMER_OPTIONS: [10,20,30,60],
  TURN_TIMER_START_DELAY: 5,          // 차례 시작 후 이 시간 동안은 타이머가 멈춰 있음(화면 전환·로딩 손해 보정)
  TURN_TIMER_WARN_SECONDS: 10,        // 이 시간 이하부터 빨간색 깜빡임
  TURN_TIMER_GRACE_SECONDS: 5,        // 월드: 차례인 기기가 응답 없으면 이 시간 뒤 다른 기기가 대신 강제 진행
};
/** 판마다 정하는 옵션. 방장/로컬 진행자가 정하고 게임 상태(g.settings)에 저장되어 모든 기기에서 같은 값으로 동작 */
const GAME_SETTING_DEFAULTS = {
  setupMode: 'start',          // 'start' 출발 구역 나란히 | 'dice' 공식 주사위 배치
  diceDrawnPerLeg: 6,          // 6 모두 공개 | 5 공식(1개 남김)
  randomOrder: true,           // 첫 순서 무작위 | 입력/입장 순서
  legStartOrder: 'sequential', // 2구간부터: 'sequential' 순차 | 'poorest' 코인 최소 플레이어부터
  timerEnabled: false, timerSeconds: 30,
  partnershipEnabled: false,   // 6인 이상에서만 실제 적용
};
const SETTING_LABELS = {
  setupMode: ['낙타 시작 위치', {start:'출발 구역(나란히)', dice:'공식(주사위 1~3)'}],
  diceDrawnPerLeg: ['구간 종료 시점', {6:'주사위 6개 모두', 5:'공식(5개, 1개 남김)'}],
  randomOrder: ['진행 순서', {true:'무작위', false:'입력/입장 순서'}],
  legStartOrder: ['LEG 시작 순서 (2구간~)', {sequential:'순차 진행', poorest:'코인 최소 플레이어부터'}],
  timerEnabled: ['턴 타이머', {true:'켬', false:'끔'}],
  timerSeconds: ['타이머 시간', {10:'10초',20:'20초',30:'30초',60:'60초'}],
  partnershipEnabled: ['베팅 파트너십', {true:'켬', false:'끔'}],
};
const PLAYER_COUNT_CONFIG = {
  3: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  4: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  5: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  6: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  7: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  8: { startCoins: 3, finalCardsPerPlayer: 5, spectatorTilesPerPlayer: 1, official: true },
  // 공식 규칙상 인원이 늘어도 시작 코인(3), 최종 베팅 카드(낙타별 1장), 관중 타일(1), 구간 베팅 타일(낙타별 5·3·2·2)은 동일
};
const CAMEL_INFO = {
  red:{name:'빨강',css:'#FF6B6B',dark:'#C64545'}, blue:{name:'파랑',css:'#4D8DFF',dark:'#2F62C4'}, green:{name:'초록',css:'#4CC46A',dark:'#2E8F49'},
  yellow:{name:'노랑',css:'#FFCF3F',dark:'#C99A12'}, purple:{name:'보라',css:'#B07CFF',dark:'#7E52C9'},
  black:{name:'검정(미친)',css:'#4A4A55',dark:'#222'}, white:{name:'하양(미친)',css:'#F4F1EA',dark:'#9A948A'},
};

/* =====================================================================
   2. 게임 엔진 — UI와 분리된 순수 함수. rng 주입 가능(테스트/서버 재사용).
   ===================================================================== */
const isCrazy = c => GAME_RULES.CRAZY_CAMELS.includes(c);
/** 기본 난수: 암호학적 난수(crypto) 기반 0~1. 테스트/서버에서는 rng를 주입해 대체 */
const secureRandom = () => (typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 : Math.random();
const rollDie = rng => GAME_RULES.DIE_FACES[Math.floor(rng()*GAME_RULES.DIE_FACES.length)];
function shuffle(arr, rng=secureRandom){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function createGame(players, rng = secureRandom, settings = {}) {
  // players: [{name, clientId?}] — 이미 턴 순서대로 정렬된 상태로 전달
  const cfg = PLAYER_COUNT_CONFIG[players.length];
  if (!cfg) throw new Error('지원하지 않는 인원: ' + players.length);
  const s = {
    playerCount:players.length, config:cfg,
    players: players.map((p,id)=>({ id, name:p.name, clientId:p.clientId||null, title:p.title||null, rp:p.rp??null, coins:cfg.startCoins, finalCards:[...GAME_RULES.RACING_CAMELS], pyramidTickets:0 })),
    currentPlayerIndex:0, currentLeg:1, status:'playing', winner:null,
    stacks:{}, spectatorTiles:{},
    dicePool:[...GAME_RULES.RACING_CAMELS,'grey'], usedDice:[],
    legTickets:Object.fromEntries(GAME_RULES.RACING_CAMELS.map(c=>[c,[...GAME_RULES.LEG_BET_TICKETS]])),
    legBets:[], finalBets:{winner:[],loser:[]}, log:[],
    partnershipEnabled:false, partnerships:[],   // 파트너십: {a,b} 이번 구간 동안 유효
    settings: { ...GAME_SETTING_DEFAULTS, ...settings },
    stats:{}, legLog:[],   // 칭호 판정용 기록: 플레이어별 베팅 통계, 구간별 첫 행동자/마지막 주사위
  };
  s.partnershipEnabled = !!s.settings.partnershipEnabled && players.length >= GAME_RULES.PARTNERSHIP_MIN_PLAYERS;
  s.timerEnabled = !!s.settings.timerEnabled; s.timerSeconds = s.settings.timerSeconds;
  if (s.settings.setupMode === 'dice') {
    for (const c of GAME_RULES.RACING_CAMELS) place(s, c, rollDie(rng));
    for (const c of GAME_RULES.CRAZY_CAMELS) place(s, c, GAME_RULES.TRACK_LENGTH + 1 - rollDie(rng));
  } else {
    // 출발 구역: 순서만 무작위(동점 시 순위용), 화면에는 나란히 표시
    for (const c of shuffle([...GAME_RULES.RACING_CAMELS, ...GAME_RULES.CRAZY_CAMELS], rng)) place(s, c, GAME_RULES.START_ZONE);
  }
  return s;
}
function place(s, color, pos, under=false){ const st = s.stacks[pos] || (s.stacks[pos]=[]); under ? st.unshift(color) : st.push(color); }
function locate(s, color){ for (const p in s.stacks){ const i=s.stacks[p].indexOf(color); if(i>=0) return {pos:+p, idx:i}; } return null; }
const currentPlayer = s => s.players[s.currentPlayerIndex];
const addCoins = (p, n) => { p.coins = Math.max(GAME_RULES.MIN_COINS, p.coins + n); };

/** 낙타 이동: 이동 낙타 + 그 위의 모든 낙타가 함께 이동. 관중 타일 효과 포함. */
function moveCamel(s, color, steps){
  const dir = isCrazy(color) ? -1 : 1, ev = [];
  const {pos, idx} = locate(s, color);
  const atStart = pos === GAME_RULES.START_ZONE;
  // 출발 구역에서는 스택이 없다 → 이동하는 낙타 한 마리만 나간다
  const moving = atStart ? s.stacks[pos].splice(idx, 1) : s.stacks[pos].splice(idx);
  if (!s.stacks[pos].length) delete s.stacks[pos];
  // 미친 낙타는 출발선 바로 뒤가 16번 칸: 출발 구역을 17번으로 보고 뒤로 센다
  const base = (isCrazy(color) && atStart) ? GAME_RULES.TRACK_LENGTH + 1 : pos;
  let target = base + steps*dir, under = false;
  target = wrapCrazy(color, target);
  const tile = target <= GAME_RULES.TRACK_LENGTH ? s.spectatorTiles[target] : null;
  if (tile){
    addCoins(s.players[tile.owner], GAME_RULES.SPECTATOR_TILE_COIN);
    ev.push({type:'tile', side:tile.side, owner:tile.owner, at:target});
    if (tile.side==='cheer') target += dir; else { target -= dir; under = true; }
    target = wrapCrazy(color, target);
  }
  const existing = s.stacks[target] || [];
  s.stacks[target] = under ? [...moving, ...existing] : [...existing, ...moving];
  ev.push({type:'move', color, moving:[...moving], from:pos, to:target, under});
  return ev;
}
/** 미친 낙타가 1번 칸보다 뒤로 가면 16번으로 이어진다 (CRAZY_WRAP=false면 1번에서 멈춤) */
function wrapCrazy(color, target){
  if (!isCrazy(color) || target >= 1) return target;
  return GAME_RULES.CRAZY_WRAP ? target + GAME_RULES.TRACK_LENGTH : 1;
}
function resolveCrazyMover(s, dieColor){  // OPEN-004
  const carrying = GAME_RULES.CRAZY_CAMELS.filter(c=>{ const l=locate(s,c); const above=s.stacks[l.pos][l.idx+1]; return above && !isCrazy(above); });
  return carrying.length===1 ? carrying[0] : dieColor;
}
function ranking(s){
  return GAME_RULES.RACING_CAMELS.map(c=>({color:c, ...locate(s,c)})).sort((a,b)=> b.pos-a.pos || b.idx-a.idx).map(x=>x.color);
}
const isFinished = s => GAME_RULES.RACING_CAMELS.some(c=>locate(s,c).pos > GAME_RULES.TRACK_LENGTH);

function actionDrawDie(s, rng=secureRandom, opts={}){
  const i = Math.floor(rng()*s.dicePool.length);
  const dieColor = s.dicePool.splice(i,1)[0];
  const value = rollDie(rng);
  let camel = dieColor, crazyFace = null;
  if (dieColor==='grey'){ crazyFace = GAME_RULES.CRAZY_CAMELS[Math.floor(rng()*GAME_RULES.CRAZY_CAMELS.length)]; camel = resolveCrazyMover(s, crazyFace); }
  s.usedDice.push({die:dieColor, face:crazyFace||dieColor, value, camel});
  const p = currentPlayer(s);
  const rewarded = !opts.forced;                         // 시간 초과 강제 굴림은 피라미드 보상 없음
  if (rewarded){ addCoins(p, GAME_RULES.PYRAMID_TICKET_COIN); p.pyramidTickets++; }
  const events = moveCamel(s, camel, value);
  s.log.unshift(`${p.name}: 🎲 ${CAMEL_INFO[camel].name} 낙타 ${value}칸${rewarded?'':' (시간 초과 · 코인 없음)'}`);
  return { die:dieColor, face:crazyFace||dieColor, value, camel, events, rewarded };
}
/** 칭호 판정용 통계(게임 규칙에 영향 없음) */
function statOf(s, id){ s.stats ||= {}; return s.stats[id] ||= { legTickets:[], legHits:0, legNoBet:0, whaleLegs:0, cur:{tickets:[], finals:0}, partnerGot:0, partnerGiven:0 }; }
function actionLegBet(s, color){
  const t = s.legTickets[color]; if(!t.length) throw new Error('남은 타일 없음');
  const value = t.shift(); s.legBets.push({player:s.currentPlayerIndex, color, value});
  const st=statOf(s,s.currentPlayerIndex); st.legTickets.push(value); st.cur.tickets.push(value);
  s.log.unshift(`${currentPlayer(s).name}: ${CAMEL_INFO[color].name} 구간 베팅(${value})`);
}
function actionFinalBet(s, color, type){
  const p = currentPlayer(s); const i = p.finalCards.indexOf(color); if(i<0) throw new Error('카드 없음');
  p.finalCards.splice(i,1); s.finalBets[type].push({player:p.id, color}); statOf(s,p.id).cur.finals++;
  s.log.unshift(`${p.name}: 최종 ${type==='winner'?'1등':'꼴찌'} 카드 사용 (비공개)`);
}
function validTileSpaces(s){
  const me = s.currentPlayerIndex, out=[];
  for (let p=1;p<=GAME_RULES.TRACK_LENGTH;p++){
    if (GAME_RULES.SPECTATOR_TILE_FORBIDDEN.includes(p) || s.stacks[p]) continue;
    const other = q => s.spectatorTiles[q] && s.spectatorTiles[q].owner!==me;
    if (other(p)) continue;
    if (GAME_RULES.SPECTATOR_TILE_NO_ADJACENT && (other(p-1)||other(p+1))) continue;
    out.push(p);
  }
  return out;
}
function actionPlaceTile(s, pos, side){
  if(!validTileSpaces(s).includes(pos)) throw new Error('놓을 수 없는 칸');
  for (const q in s.spectatorTiles) if (s.spectatorTiles[q].owner===s.currentPlayerIndex) delete s.spectatorTiles[q];
  s.spectatorTiles[pos] = {owner:s.currentPlayerIndex, side};
  s.log.unshift(`${currentPlayer(s).name}: ${pos}번 칸에 ${side==='cheer'?'응원':'야유'} 타일`);
}
/** 베팅 파트너십(공식 선택 규칙, 6인+): 이번 구간 동안 파트너가 구간 베팅 타일로 번 코인만큼 나도 받는다(손실은 공유 안 함) */
const partnerOf = (s, id) => { const p=s.partnerships.find(x=>x.a===id||x.b===id); return p ? (p.a===id?p.b:p.a) : null; };
function eligiblePartners(s){
  if (!s.partnershipEnabled || partnerOf(s, s.currentPlayerIndex)!==null) return [];
  return s.players.filter(p=>p.id!==s.currentPlayerIndex && partnerOf(s,p.id)===null).map(p=>p.id);
}
function actionPartnership(s, otherId){
  if (!eligiblePartners(s).includes(otherId)) throw new Error('파트너십 불가');
  s.partnerships.push({a:s.currentPlayerIndex, b:otherId});
  s.log.unshift(`${currentPlayer(s).name}: 🤝 ${s.players[otherId].name}와(과) 베팅 파트너십`);
}
function endTurn(s){
  const result = { legEnded:false, gameEnded:false, leg:null, final:null };
  s.legLog ||= [];
  if (isFinished(s)) { result.gameEnded = true; s.legLog.push({leg:s.currentLeg, lastRoller:s.currentPlayerIndex, firstActor:null}); result.leg = settleLeg(s); result.final = settleFinal(s); s.status='finished'; return result; }
  const perLeg = s.settings?.diceDrawnPerLeg ?? GAME_RULES.DICE_DRAWN_PER_LEG;
  if (s.usedDice.length >= perLeg) {
    const entry={leg:s.currentLeg, lastRoller:s.currentPlayerIndex, firstActor:null}; s.legLog.push(entry);
    result.legEnded = true; result.leg = settleLeg(s); startNextLeg(s);
    if (s.settings?.legStartOrder === 'poorest') {
      // 코인이 가장 적은 플레이어부터. 동점이면 방금 턴을 마친 사람 다음 순서에 가까운 쪽
      const from = s.currentPlayerIndex; let best = null;
      for (let k=1;k<=s.playerCount;k++){ const i=(from+k)%s.playerCount; if (best===null || s.players[i].coins < s.players[best].coins) best=i; }
      s.currentPlayerIndex = best; entry.firstActor=best; return result;
    }
    entry.firstActor=(s.currentPlayerIndex+1)%s.playerCount;
  }
  s.currentPlayerIndex = (s.currentPlayerIndex+1) % s.playerCount;
  return result;
}
function settleLeg(s){
  const rank = ranking(s), lines=[], tickets={};
  for (const b of s.legBets){
    const gain = b.color===rank[0] ? b.value : b.color===rank[1] ? GAME_RULES.LEG_BET_SECOND_PLACE : GAME_RULES.LEG_BET_WRONG;
    addCoins(s.players[b.player], gain); lines.push({player:b.player, text:`${CAMEL_INFO[b.color].name} 베팅 ${gain>0?'+':''}${gain}`});
    (tickets[b.player] ||= []).push({color:b.color, gain});
    if (b.color===rank[0]) statOf(s,b.player).legHits++;
  }
  // 구간 단위 플레이 스타일 기록
  for (const p of s.players){ const st=statOf(s,p.id); if (!st.cur.tickets.length && !st.cur.finals) st.legNoBet++; if (st.cur.tickets.reduce((a,b)=>a+b,0)>10) st.whaleLegs++; st.cur={tickets:[], finals:0}; }
  // 파트너십: 파트너의 구간 베팅 티켓 중 1장을 골라 그 보상을 추가로 받음 (양쪽 모두). 합리적 선택 = 가장 큰 보상, 0 이하면 받지 않음
  for (const ps of s.partnerships){
    for (const [me, other] of [[ps.a,ps.b],[ps.b,ps.a]]){
      const best = (tickets[other]||[]).reduce((m,t)=> !m||t.gain>m.gain ? t : m, null);
      if (best && best.gain>0){ addCoins(s.players[me], best.gain); lines.push({player:me, text:`🤝 파트너 ${s.players[other].name}의 ${CAMEL_INFO[best.color].name} 티켓 보상 +${best.gain}`});
        if (me===ps.a){ statOf(s,me).partnerGot++; statOf(s,other).partnerGiven++; } }   // a=협상을 건 사람, b=받은 사람
    }
  }
  return { first:rank[0], second:rank[1], lines };
}
function startNextLeg(s){
  s.legBets=[]; s.spectatorTiles={}; s.usedDice=[]; s.dicePool=[...GAME_RULES.RACING_CAMELS,'grey']; s.currentLeg++;
  s.legTickets = Object.fromEntries(GAME_RULES.RACING_CAMELS.map(c=>[c,[...GAME_RULES.LEG_BET_TICKETS]]));
  s.players.forEach(p=>p.pyramidTickets=0);
  s.partnerships=[];
}
function settleFinal(s){
  const rank = ranking(s), lines=[];
  for (const [type, target] of [['winner',rank[0]],['loser',rank[rank.length-1]]]){
    let correct=0;
    for (const b of s.finalBets[type]){
      const gain = b.color===target ? (GAME_RULES.FINAL_BET_PAYOUT[correct++] ?? GAME_RULES.FINAL_BET_PAYOUT.at(-1)) : GAME_RULES.FINAL_BET_WRONG;
      addCoins(s.players[b.player], gain); lines.push({player:b.player, type, color:b.color, gain, hit:b.color===target, text:`최종 ${type==='winner'?'1등':'꼴찌'} ${CAMEL_INFO[b.color].name} ${gain>0?'+':''}${gain}`});
    }
  }
  const standings = [...s.players].sort((a,b)=>b.coins-a.coins);
  s.winner = standings[0].id;
  return { rank, lines, standings };
}

/* =====================================================================
   2b. 영구 성장 시스템 — 게임 엔진과 분리된 순수 계산 (EP / RP / 티어 / 칭호)
   ===================================================================== */
const GROWTH_RULES = {
  // 인원별 순위 RP (OPEN-007: 8인 5등 값은 표에 없어 +6으로 보간)
  RP_TABLE: { 3:[20,10,-5], 4:[30,15,0,-5], 5:[30,20,0,-5,-8], 6:[30,20,10,0,-5,-8], 7:[30,20,10,5,0,-5,-8], 8:[30,24,18,12,6,0,-5,-8] },
  RP_FIRST: 30, RP_LAST: -30,        // 표에 없는 인원(이전 버전 2인 기록 등)은 선형 보간
  RP_MIN: 0,
  TIERS: [ // [이름, 목표 RP, 색상, 굵기, 강조 배경(Diamond 이상)]
    ['Iron',0,'#7A7A7A',500],['Bronze',100,'#A66A3F',600],['Silver',220,'#8C96A3',600],['Gold',400,'#D4A72C',700],
    ['Platinum',650,'#35A6A6',700],['Diamond',1000,'#5369B5',700,'#DCE6FF'],['Master',1400,'#8A55A8',800,'#EDDCF7'],
    ['Grandmaster',1900,'#B84A57',800,'#FBD9DC'],['Challenger',2500,'#B88A28',800,'#FFEFB0'] ],
  COLOR_TITLE_STEPS: [[5,'러버'],[12,'추종자'],[25,'맘']],
  COLOR_KO: {red:'레드',blue:'블루',green:'그린',yellow:'옐로우',purple:'보라'},
  BIG_HAND_COINS: 70,
};
function rankRP(rank, playerCount){
  const row=GROWTH_RULES.RP_TABLE[playerCount]; if (row) return row[rank-1] ?? row[row.length-1];
  if (playerCount<=1) return 0;
  return Math.round(GROWTH_RULES.RP_FIRST + (GROWTH_RULES.RP_LAST-GROWTH_RULES.RP_FIRST)*(rank-1)/(playerCount-1));
}
const tierObj = t => ({name:t[0], min:t[1], color:t[2], weight:t[3], bg:t[4]||null});
function getTierByRP(rp){ let t=GROWTH_RULES.TIERS[0]; for (const x of GROWTH_RULES.TIERS) if (rp>=x[1]) t=x; return tierObj(t); }

/** 게임 기록 1건을 프로필에 반영. 같은 게임은 두 번 반영되지 않는다. rec: {id, players, myRank, myCoins, predHits[]} */
function applyGrowthForRecord(profile, rec){
  if (!rec.myRank || profile.processedGameIds.includes(rec.id)) return null;
  const before = { ep:profile.totalEP, rp:profile.rp, tier:getTierByRP(profile.rp).name, titles:new Set(TITLES.filter(t=>titleProgress(profile,t).earned).map(t=>t.id)) };
  profile.totalEP += Math.max(0, rec.myCoins||0);
  profile.rp = Math.max(GROWTH_RULES.RP_MIN, profile.rp + rankRP(rec.myRank, rec.players.length));
  profile.games++; if (rec.myRank===1) profile.wins++; profile.maxCoins=Math.max(profile.maxCoins, rec.myCoins||0);
  for (const c of (rec.predHits||[])) if (profile.colorPredict[c]!==undefined){ profile.colorPredict[c]++; profile.predictTotal++; }
  profile.loserPredict = (profile.loserPredict||0) + (rec.loserHits||[]).length;
  // 연속 예측: 예측 정보가 있는 기록만 반영 (이전 버전 기록은 연속을 끊지도 잇지도 않음)
  if (Array.isArray(rec.predAll)){ profile.winStreak = (rec.predHits||[]).length ? (profile.winStreak||0)+1 : 0; profile.winStreakMax=Math.max(profile.winStreakMax||0, profile.winStreak); }
  if ((rec.predHits||[]).length && (rec.winStack||0)>=3) profile.stackWinPredict=(profile.stackWinPredict||0)+1;
  const f=rec.feats||{};
  profile.indecisive=(profile.indecisive||0)+(f.indecisive?1:0); profile.ant=(profile.ant||0)+(f.ant?1:0); profile.streakStart=(profile.streakStart||0)+(f.streakStart?1:0);
  profile.observerLegs=(profile.observerLegs||0)+(f.observerLegs||0); profile.negotiator=(profile.negotiator||0)+(f.negotiator?1:0); profile.whaleLegs=(profile.whaleLegs||0)+(f.whaleLegs||0);
  profile.considerate=(profile.considerate||0)+(f.considerate?1:0); profile.donor=(profile.donor||0)+(f.donor?1:0); profile.chatty=(profile.chatty||0)+(f.chatty?1:0);
  profile.processedGameIds.push(rec.id);
  const nowTitles = TITLES.filter(t=>titleProgress(profile,t).earned).map(t=>t.id);
  profile.earnedTitleIds = nowTitles;
  return { epDelta:profile.totalEP-before.ep, rpDelta:profile.rp-before.rp, ep:profile.totalEP, rp:profile.rp,
    tierBefore:before.tier, tierAfter:getTierByRP(profile.rp).name, newTitles:nowTitles.filter(id=>!before.titles.has(id)) };
}

/** 게임 1판의 플레이 스타일 달성 여부 (엔진이 남긴 stats/legLog로 계산) */
function computeFeats(g, myId, chatCount=0){
  const st=(g.stats||{})[myId]||{legTickets:[],legHits:0,legNoBet:0,whaleLegs:0,partnerGot:0,partnerGiven:0}, log=g.legLog||[];
  const finalColors=new Set([...g.finalBets.winner,...g.finalBets.loser].filter(b=>b.player===myId).map(b=>b.color));
  const afterFirst=log.filter(e=>e.firstActor!==null);   // LEG 2 이후 첫 행동자 기록
  return {
    indecisive: finalColors.size===GAME_RULES.RACING_CAMELS.length,
    ant: st.legTickets.length>0 && !st.legTickets.some(v=>v>2) && st.legHits>=2,
    streakStart: g.settings?.legStartOrder==='poorest' && afterFirst.length>=1 && afterFirst.every(e=>e.firstActor===myId),
    observerLegs: st.legNoBet,
    negotiator: st.partnerGot>=1,
    whaleLegs: st.whaleLegs,
    considerate: g.settings?.legStartOrder==='sequential' && log.length>=2 && log.every(e=>e.lastRoller===myId),
    donor: st.partnerGiven>=5,
    chatty: chatCount >= 50,
  };
}

  s=createGame([{name:'A'},{name:'B'},{name:'C'}]); ok('CASE21 초기 세팅: 7마리 모두 출발 구역', s.stacks[0]?.length===7);
  s=createGame([{name:'A'},{name:'B'},{name:'C'}],()=>0); moveCamel(s,'black',2); moveCamel(s,'red',1);
    ok('CASE22 출발 구역: 스택 없이 한 마리만 이동, 미친 낙타 2 → 15번', (s.stacks[15]?.[0]==='black' && s.stacks[1]?.[0]==='red' && s.stacks[0]?.length===5));

/** 사각 둘레 트랙(부루마블형). 5×5 격자의 바깥 16칸이 트랙, 안쪽 3×3이 출발/대기 구역.
    결승선은 아래줄 가운데(16번|1번 사이), 진행은 아래줄 → 오른쪽 → 위줄 → 왼쪽 순으로 한 바퀴. */
function trackGeometry(track){
  const W=track.clientWidth, pad=8, gap=5, N=5;
  const cw=Math.floor((W-2*pad-(N-1)*gap)/N), ch=Math.min(cw, 62), H=2*pad+N*ch+(N-1)*gap;
  // 칸 p → 격자 (col,row). row 0이 위, row 4가 아래.
  const grid=p=>{
    if (p<=2)  return {col:2+p, row:4};        // 1,2: 아래줄 오른쪽으로
    if (p<=6)  return {col:4, row:6-p};        // 3~6: 오른쪽 기둥 위로 (6=우상 모서리)
    if (p<=10) return {col:10-p, row:0};       // 7~10: 위줄 왼쪽으로 (10=좌상 모서리)
    if (p<=14) return {col:0, row:p-10};       // 11~14: 왼쪽 기둥 아래로 (14=좌하 모서리)
    return {col:p-14, row:4};                  // 15,16: 아래줄 오른쪽으로 → 결승선
  };
  const cell=p=>{ const g=grid(p); return {x:pad+g.col*(cw+gap), y:pad+g.row*(ch+gap), col:g.col, row:g.row}; };
  const facesLeft=p=>{ const g=grid(p); return g.row===0 || (g.col===0 && g.row<4); };   // 위줄·왼쪽 기둥은 왼쪽을 본다
  const inner={x:pad+(cw+gap), y:pad+(ch+gap), w:3*cw+2*gap, h:3*ch+2*gap};
  return {W,H,cw,ch,pad,gap,cell,facesLeft,inner};
}
function layoutTrack(){
  const g=ui.game, track=$app.querySelector('.track'); if(!track||!g) return;
  const G=trackGeometry(track); track.style.height=G.H+'px';
  const camW=42, camH=31;
  track.querySelectorAll('.cell').forEach(el=>{ const c=G.cell(+el.dataset.pos); el.style.left=c.x+'px'; el.style.top=c.y+'px'; el.style.width=G.cw+'px'; el.style.height=G.ch+'px';
    el.classList.toggle('corner', (c.col===0||c.col===4)&&(c.row===0||c.row===4)); });
  const I=G.inner;
  // 진행 방향 화살표: 안쪽 영역 가장자리
  const ar=(cls,l,t)=>{ const el=track.querySelector('.arrow.'+cls); el.style.left=l+'px'; el.style.top=t+'px'; };
  ar('a-bottom', I.x+I.w/2-8, I.y+I.h-18); ar('a-right', I.x+I.w-18, I.y+I.h/2-8); ar('a-top', I.x+I.w/2-8, I.y+2); ar('a-left', I.x+2, I.y+I.h/2-8);
  // 결승선: 아래줄 16번|1번 사이
  const c1=G.cell(1); const fl=track.querySelector('.finishline'); fl.style.left=(c1.x-G.gap/2-4)+'px'; fl.style.top=(c1.y-4)+'px'; fl.style.width='8px'; fl.style.height=(G.ch+8)+'px';
  const fz=track.querySelector('.zone.fin'); fz.style.left=(c1.x-G.gap/2-14)+'px'; fz.style.top=(c1.y-24)+'px'; fz.style.width='28px'; fz.style.fontSize='16px';
  // 출발 구역(일반 낙타 5) 안쪽 아래, 미친 낙타 구역 안쪽 위
  const startW=Math.min(5*(camW+4)+8, I.w-24), startH=camH+22;
  const sz=track.querySelector('.zone.start'); sz.style.left=(I.x+I.w/2-startW/2)+'px'; sz.style.top=(I.y+I.h-startH-20)+'px'; sz.style.width=startW+'px'; sz.style.height=startH+'px';
  const cz=track.querySelector('.zone.crazyzone'); cz.style.left=(I.x+I.w/2-startW/2)+'px'; cz.style.top=(I.y+16)+'px'; cz.style.width=startW+'px';
  const startTop=I.y+I.h-startH-20, crazyTop=I.y+16;
  // 낙타 좌표
  const prev = ui.camelXY || {}; const next = {};
  const startRacing=[], startCrazy=[];
  for (const c of [...GAME_RULES.RACING_CAMELS,...GAME_RULES.CRAZY_CAMELS]){
    const {pos,idx}=locate(g,c); if(pos===GAME_RULES.START_ZONE) (isCrazy(c)?startCrazy:startRacing).push(c);
  }
  for (const c of [...GAME_RULES.RACING_CAMELS,...GAME_RULES.CRAZY_CAMELS]){
    const {pos,idx}=locate(g,c), el=track.querySelector(`.camel[data-camel="${c}"]`);
    let x, y, z=10+idx, left=isCrazy(c);   // 출발 구역: 일반 낙타는 → 1번(오른쪽), 미친 낙타는 ← 16번(왼쪽)
    if (pos===GAME_RULES.START_ZONE){
      const row=isCrazy(c)?startCrazy:startRacing, k=row.indexOf(c), n=row.length;
      const slot=isCrazy(c)? camW+16 : Math.min(camW+4, (startW-8)/Math.max(n,1));
      x = I.x+I.w/2 - (n*slot)/2 + k*slot + (slot-camW)/2;
      y = isCrazy(c) ? crazyTop+16 : startTop+startH-camH-6;
    } else if (pos>GAME_RULES.TRACK_LENGTH){          // 결승 통과: 안쪽 중앙에 순서대로
      x = I.x+I.w/2-camW/2 + (pos-17)*26 - 30; y = I.y+I.h/2-camH/2;
    } else {
      const cpos=G.cell(pos); x = cpos.x + G.cw/2 - camW/2; y = cpos.y + G.ch - camH - 2 - idx*11;
      left = G.facesLeft(pos) !== isCrazy(c);       // 트랙 위: 진행 방향을 따라 보고, 미친 낙타는 반대
    }
    el.classList.toggle('flip', left);
    next[c]={x,y}; el.style.zIndex=z;
    const target=`translate(${x}px,${y}px)`;
    if (el.dataset.placed){ el.style.transform=target; continue; }
    // 새로 만들어진 요소: 이전 좌표에 전환 없이 세운 뒤 새 좌표로 미끄러짐 (없으면 (0,0)에서 떨어지는 현상 발생)
    const from = prev[c] || {x,y};
    el.style.transition='none'; el.style.transform=`translate(${from.x}px,${from.y}px)`; el.dataset.placed='1';
    void el.offsetWidth;
    el.style.transition=''; el.style.transform=target;
    if (from.x!==x || from.y!==y) el.classList.add('moving');
  }
  ui.camelXY = next;
}

window.drawDie = ()=>{
  const g=ui.game;
  ui.pendingResult={html:`<div class="pyramid shake">${PYRAMID_SVG}</div><p style="text-align:center;font-weight:800">피라미드를 흔드는 중…</p>`}; render();
  setTimeout(()=>{
    const wasForced = ui.forcedRoll; ui.forcedRoll=false;
    const r = actionDrawDie(g, undefined, {forced:wasForced});
    const dieCss = r.die==='grey' ? '#9A9AA6' : CAMEL_INFO[r.die].css;
    const evs = r.events.map(e=> e.type==='tile' ? `<div>${e.side==='cheer'?'👏 응원 타일! 1칸 더 앞으로':'👎 야유 타일! 1칸 뒤로'} (${esc(g.players[e.owner].name)} +${GAME_RULES.SPECTATOR_TILE_COIN})</div>`
      : `<div>${e.moving.map(dot).join('')} ${e.from}번 → ${e.to>GAME_RULES.TRACK_LENGTH?'🏁 결승!':e.to+'번 칸'}${e.moving.length>1?' (스택 함께 이동)':''}</div>`).join('');
    const forcedNote = wasForced ? `<div style="background:var(--warn);color:#fff;border-radius:12px;padding:6px 10px;font-weight:900;margin-bottom:8px">⏰ 시간 초과! 자동으로 주사위를 뽑았어요 (코인 보상 없음)</div>` : '';
    afterAction(forcedNote+`<div style="display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:8px"><div class="die reveal" style="background:${dieCss};width:56px;height:56px;font-size:28px">${r.value}</div>
      <div><b>${esc(currentPlayer(g).name)}: ${CAMEL_INFO[r.camel].name} 낙타 ${r.value}칸 ${isCrazy(r.camel)?'뒤로':'앞으로'}!</b>${r.die==='grey'&&r.face!==r.camel?'<br><small>주사위는 '+CAMEL_INFO[r.face].name+'이지만 낙타를 업은 쪽이 이동</small>':''}${r.rewarded?`<br><small>주사위 뽑기 보상 +${GAME_RULES.PYRAMID_TICKET_COIN} 코인</small>`:''}</div></div>${evs}`);
    r.events.filter(e=>e.type==='move').forEach(e=>e.moving.forEach(c=>$app.querySelector(`.camel[data-camel="${c}"]`)?.classList.add('moving')));
    if (wasForced && !isWorld()) setTimeout(()=>{ if (ui.pendingResult && ui.screen==='game') finishTurn(); }, 3000);  // 로컬: 자리 비운 사람 대신 턴 넘김
  }, 900);
};
window.openLegBet = ()=>{

/* =====================================================================
   6. 월드 모드 — 아티팩트 공유 저장소(window.storage, shared=true)로 상태 교환
      · 방 상태 전체를 'room:CODE' 키 하나에 저장 (관련 데이터 한 키에 묶기)
      · 현재 차례 플레이어의 기기가 엔진을 실행하고 업로드, 나머지는 주기적으로 불러옴
      · 저장 전 version을 비교해 다른 기기의 갱신을 덮어쓰지 않음
   ===================================================================== */
const hasStorage = () => !!(window.storage && typeof window.storage.get==='function');
/** 실제로 쓰기가 되는지 확인 (API 객체는 있어도 이 아티팩트에서 비활성일 수 있음) */
async function probeStorage(){
  if (!hasStorage()) { ui.storageState='none'; return; }
  try { await window.storage.set('probe', '1', true); await window.storage.delete('probe', true); ui.storageState='ok'; }
  catch(e){ ui.storageState='blocked'; ui.storageErr=e.message||String(e); }
}
const roomKey = code => 'room:'+code;
async function getClientId(){
  if (ui.clientId) return ui.clientId;
  try { const r=await window.storage.get('me',false); const me=JSON.parse(r.value); ui.clientId=me.clientId; ui.myName=ui.myName||me.name||''; ui.joinCode=ui.joinCode||me.lastRoom||''; }
  catch { ui.clientId='c'+Math.random().toString(36).slice(2,10); }
  return ui.clientId;
}
async function saveMe(){ try{ await window.storage.set('me', JSON.stringify({clientId:ui.clientId, name:ui.myName, lastRoom:ui.room?.code||ui.joinCode}), false);}catch{} }
async function loadRoom(code){ try{ const r=await window.storage.get(roomKey(code),true); return JSON.parse(r.value);}catch{ return null; } }
async function saveRoom(room){ room.version=(room.version||0)+1; room.updatedAt=Date.now(); await window.storage.set(roomKey(room.code), JSON.stringify(room), true); ui.room=room; ui.room.baseLogLen=room.game?room.game.log.length:0; ui.lastSync=Date.now(); }
/** 낙관적 동시성: 최신 버전을 읽어 내 버전과 다르면 실패 */
async function commit(mutate){
  // 최신본을 읽어 그 위에 변경을 적용한다 (대기실 토글·채팅처럼 게임 상태와 무관한 변경 전용)
  const latest = await loadRoom(ui.room.code);
  if (latest && latest.version !== ui.room.version) applyRoom(latest);
  mutate(ui.room); await saveRoom(ui.room); return true;
}
function applyRoom(room){
  if (room.status!=='playing' || !ui.game || ui.room?.code!==room.code) ui.camelXY=null;
  ui.room=room; ui.room.baseLogLen=room.game?room.game.log.length:0; ui.lastSync=Date.now(); chatRender();
  if (room.status==='lobby'){ ui.screen='lobby'; ui.game=null; return; }
  ui.game=room.game;
  if (room.status==='finished'){ ui.result=room.result; ui.screen='result'; recordGame(room.game, room.result); return; }
  if (ui.screen!=='game'){ ui.screen='game'; if (room.game.log.length===0) queueOverlay(orderOverlay(room.game,'nextOverlay()')); }
  // 구간 종료 안내: 마지막 주사위를 뽑은 사람뿐 아니라 모든 기기에서 한 번씩
  if (room.legNotice && room.legNotice.leg!==ui.shownLegNotice){ ui.shownLegNotice=room.legNotice.leg; if (room.lastEvent) queueOverlay(eventOverlay(room.lastEvent)); queueOverlay(legNoticeHtml(room.legNotice,'nextOverlay()')); }
  // 내 차례 안내: 같은 턴에 대해 한 번만
  const turnKey = room.game.currentLeg+'-'+room.game.log.length+'-'+room.game.currentPlayerIndex;
  if (isMyTurn() && ui.lastTurnKey!==turnKey){ ui.lastTurnKey=turnKey; queueOverlay(turnOverlay(room.game)); }
}
const POLL_MS = 2000;
function startPoll(){ stopPoll(); ui.poll=setInterval(()=>refreshRoom(false), POLL_MS); }
/** 변화가 없을 때는 화면 전체를 다시 그리지 않고 동기화 문구만 바꾼다 */
function patchSyncText(){
  const el=$app.querySelector('.sync-text'); if(!el) return;
  el.innerHTML = ui.syncErr ? '⚠️ '+esc(ui.syncErr) : ui.committing ? '<span class="spin">🔄</span> 내 행동 공유 중' : ui.syncing ? '<span class="spin">🔄</span> 동기화 중' : (ui.screen==='game' && isMyTurn()) ? '내 차례 · 행동하면 바로 공유돼요' : '🔄 자동 갱신 중 · 마지막 '+Math.max(0,Math.round((Date.now()-ui.lastSync)/1000))+'초 전';
}
function stopPoll(){ if(ui.poll){ clearInterval(ui.poll); ui.poll=null; } }
window.refreshRoom = async (manual)=>{
  if (!ui.room || ui.syncing || ui.committing) return;   // 내 행동을 업로드하는 동안은 절대 불러오지 않음(경쟁 조건 방지)
  if (ui.pendingResult && !manual) return;
  if (!manual && ui.screen==='game' && isMyTurn()) { patchSyncText(); return; }  // 내 차례엔 남이 바꿀 게 없다
  ui.syncing=true; patchSyncText();
  let changed=false;
  try {
    const latest=await loadRoom(ui.room.code);
    // 읽는 사이에 내가 저장했을 수 있으므로, 내 버전보다 '새로운' 것만 적용한다 (오래된 스냅샷으로 되돌리지 않음)
    if (latest && latest.version > ui.room.version && !ui.committing){ ui.pendingResult=null; ui.picking=null; applyRoom(latest); changed=true; }
    else ui.lastSync=Date.now();
    ui.syncErr='';
  } catch(e){ ui.syncErr=e.message||'연결 문제'; }
  ui.syncing=false;
  if (changed || manual) render(); else patchSyncText();
};

function viewWorld(){
  if (ui.storageState==='checking') return `<h2>🌍 월드 게임</h2><div class="card wait"><span class="spin">🔄</span> 공유 저장소 확인 중…</div>`;
  if (ui.storageState!=='ok') return `<h2>🌍 월드 게임</h2><div class="card"><b>이 화면에서는 공유 저장소를 쓸 수 없어요.</b>

/** 내 행동이 끝난 뒤: endTurn까지 처리해 방 전체 상태를 업로드 */
async function worldCommitTurn(publicHtml){
  const g=ui.game, res=endTurn(g);
  try {
    const latest = await loadRoom(ui.room.code);
    if (latest && latest.version!==ui.room.version){
      const onlyChatChanged = latest.status===ui.room.status && latest.game && latest.game.log.length===ui.room.baseLogLen;
      if (onlyChatChanged){ ui.room.chat=latest.chat||[]; ui.room.version=latest.version; }      // 채팅만 새로 온 것 → 합치고 계속
      else { ui.committing=false; ui.err='다른 기기의 갱신과 충돌해 내 행동이 취소됐어요. 다시 해주세요.'; ui.pendingResult=null; applyRoom(latest); render(); return; }
    }
    g.turnStartedAt=Date.now(); ui.room.game=g; ui.room.lastEvent=publicHtml;
    if (res.legEnded){ ui.room.legNotice=makeLegNotice(g,res); ui.shownLegNotice=ui.room.legNotice.leg; }
    if (res.gameEnded){ res.lastEvent=publicHtml; ui.room.status='finished'; ui.room.result=res; }
    await saveRoom(ui.room);
  } catch(e){
    ui.syncErr='업로드 실패, 다시 시도 중… ('+(e.message||'')+')'; patchSyncText(); setTimeout(()=>retrySave(res), 3000); return;
  }
  ui.committing=false; ui.pendingResult=null;
  if (res.gameEnded){ ui.result=res; ui.screen='result'; recordGame(g,res); render(); return; }
  if (res.legEnded){ queueOverlay(eventOverlay(publicHtml)); queueOverlay(legNoticeHtml(ui.room.legNotice,'nextOverlay()')); }
  const turnKey = g.currentLeg+'-'+g.log.length+'-'+g.currentPlayerIndex;   // 2인전 등 곧바로 내 차례가 다시 올 때
  if (isMyTurn() && ui.lastTurnKey!==turnKey){ ui.lastTurnKey=turnKey; queueOverlay(turnOverlay(g)); }
  render();
}
async function retrySave(res){
  try { await saveRoom(ui.room); } catch(e){ setTimeout(()=>retrySave(res), 3000); return; }
  ui.committing=false; ui.pendingResult=null; ui.syncErr='';
  if (res.gameEnded){ ui.result=res; ui.screen='result'; recordGame(ui.game,res); } else if (res.legEnded){ queueOverlay(eventOverlay(ui.room.lastEvent)); queueOverlay(legNoticeHtml(ui.room.legNotice,'nextOverlay()')); }
  render();
}

   7. 나의 정보 — 전적(history)과 프로필(profile)을 개인 저장소에 분리 저장

const HISTORY_MAX = 200;

async function loadProfile(){
  if (ui.profile) return ui.profile;

function buildRecord(g, res){
  const players = res.final.standings.map((p,i)=>({ name:p.name, coins:p.coins, rank:i+1, clientId:p.clientId||null }));
  const me = g.players.some(p=>p.clientId) ? players.find(p=>p.clientId===ui.clientId) : null;
  const myId = me ? g.players.find(p=>p.clientId===ui.clientId)?.id : null;
  // 최종 우승 예측 성공 색: 내가 낸 1등 카드 중 실제 1등 낙타와 같은 색 (카드는 색별 1장이라 게임당 최대 1)
  const predHits = myId!=null ? res.final.lines.filter(l=>l.type==='winner' && l.player===myId && l.hit).map(l=>l.color) : [];
  const predAll = myId!=null ? res.final.lines.filter(l=>l.type==='winner' && l.player===myId).map(l=>l.color) : [];
  const loserHits = myId!=null ? res.final.lines.filter(l=>l.type==='loser' && l.player===myId && l.hit).map(l=>l.color) : [];
  const winPos = locate(g, res.final.rank[0]); const winStack = winPos ? (g.stacks[winPos.pos]||[]).filter(c=>!isCrazy(c)).length : 1;
  const feats = myId!=null ? computeFeats(g, myId, ui.room?.chatCount?.[ui.clientId]||0) : {};
  return { id:g.gameId||('G-'+Date.now()), ts:Date.now(), mode: me?'world':'local', players,

}

/** 게임 종료 처리: 전적 저장 → EP/RP/칭호 반영 → 프로필 저장 → 결과 화면용 성장 요약 */
async function recordGame(g, res){
  if (!hasStorage() || !res?.final) return;
  const rec = buildRecord(g, res);
  if (ui.recordedIds.has(rec.id)) return; ui.recordedIds.add(rec.id);
  try {
    const h = await loadHistory();
    if (!h.games.some(x=>x.id===rec.id)){ h.games.unshift(rec); h.games = h.games.slice(0, HISTORY_MAX); await window.storage.set('history', JSON.stringify(h), false); }
    await loadProfile();
    const growth = applyGrowthForRecord(ui.profile, rec);
    if (growth){ await saveProfile(); ui.growth={ ...growth, gameId:rec.id }; render(); }
  } catch(e){ console.warn('전적/프로필 저장 실패', e); }

function rebuildGrowthFromHistory(){
  const pf=ui.profile; let n=0;
  for (const rec of [...ui.history.games].sort((a,b)=>a.ts-b.ts)) if (rec.mode==='world' && rec.myRank && applyGrowthForRecord(pf, rec)) n++;

}
const spb = () => 60/BGM.BPM/4;
function adsr(g,t,a,dcy,s,rel,hold,peak){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.linearRampToValueAtTime(peak*s,t+a+dcy); g.gain.setValueAtTime(peak*s,t+hold); g.gain.linearRampToValueAtTime(0.0001,t+hold+rel); }
function osc(type,freq,t,stop,dest,detune=0){ const o=BGM.ctx.createOscillator(); o.type=type; o.frequency.value=freq; o.detune.value=detune; o.connect(dest); o.start(t); o.stop(stop); return o; }
function lowpass(f){ const l=BGM.ctx.createBiquadFilter(); l.type='lowpass'; l.frequency.value=f; l.connect(BGM.master); return l; }
function noiseHit(t,dur,vel,type,freq,q=1){ const src=BGM.ctx.createBufferSource(); src.buffer=BGM.noise; const f=BGM.ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=BGM.ctx.createGain(); g.gain.setValueAtTime(vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); src.connect(f); f.connect(g); g.connect(BGM.master); src.start(t); src.stop(t+dur+0.02); }
function bgmPlay(e,t){
  const S=spb(), c=BGM.ctx;
  switch(e.type){
    case 'lead': { const dur=e.len*S, g=c.createGain(), lp=lowpass(3200); g.connect(lp); adsr(g,t,0.02,0.08,0.75,0.25,dur-0.05,e.vel);
      const o1=osc('triangle',midiHz(e.m),t,t+dur+0.3,g), o2=osc('sine',midiHz(e.m),t,t+dur+0.3,g,4);
      const lfo=c.createOscillator(); lfo.frequency.value=5.5; const lg=c.createGain(); lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(7,t+0.35); lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune); lfo.start(t); lfo.stop(t+dur+0.3); break; }
    case 'pad': { const dur=e.len*S, g=c.createGain(), lp=lowpass(1100); g.connect(lp); adsr(g,t,0.6,0.3,0.8,0.7,dur-0.6,0.05);
      for(const m of e.ms) for(const dt of [-6,0,6]) osc('sawtooth',midiHz(m),t,t+dur+0.8,g,dt); break; }
    case 'bass': { const dur=e.len*S, g=c.createGain(), lp=lowpass(420); g.connect(lp); adsr(g,t,0.01,0.1,0.7,0.08,dur-0.05,e.vel);
      osc('sine',midiHz(e.m),t,t+dur+0.1,g); osc('triangle',midiHz(e.m),t,t+dur+0.1,g).detune.value=2; break; }
    case 'drone': { const dur=e.len*S, g=c.createGain(); g.connect(BGM.master); adsr(g,t,1.5,0.5,1,2.0,dur-2.0,0.10);
      osc('sine',midiHz(e.m),t,t+dur+2,g); osc('sine',midiHz(e.m-12),t,t+dur+2,g); break; }
    case 'dum': { const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(55,t+0.12);
      g.gain.setValueAtTime(e.vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.connect(g); g.connect(BGM.master); o.start(t); o.stop(t+0.3); break; }
    case 'tek': noiseHit(t,0.08,e.vel,'bandpass',5000,1.2); break;
    case 'shaker': noiseHit(t,0.06,e.vel,'highpass',7000); break;
    case 'hat': noiseHit(t,0.03,e.vel,'highpass',9000); break;
    case 'pluck': { const g=c.createGain(), lp=lowpass(4000); g.connect(lp); g.gain.setValueAtTime(e.vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35); osc('triangle',midiHz(e.m),t,t+0.4,g); osc('square',midiHz(e.m),t,t+0.4,g).detune.value=3; break; }
    case 'bell': { const g=c.createGain(); g.connect(BGM.master); g.gain.setValueAtTime(e.vel,t); g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
      osc('sine',midiHz(e.m),t,t+1.3,g); const g2=c.createGain(); g2.connect(BGM.master); g2.gain.setValueAtTime(e.vel*0.5,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.4); osc('sine',midiHz(e.m)*2.76,t,t+0.5,g2); break; }
    case 'riser': { const dur=e.len*S, src=c.createBufferSource(); src.buffer=BGM.noise; src.loop=true; const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
      f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(5000,t+dur); const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+dur); g.gain.setValueAtTime(0.0001,t+dur+0.01);
      src.connect(f); f.connect(g); g.connect(BGM.master); src.start(t); src.stop(t+dur+0.05); break; }
  }
}
function bgmSchedule(){
  const S=spb();
  while (BGM.nextTime < BGM.ctx.currentTime + BGM.LOOKAHEAD){
    const list=BGM.score[BGM.step % BGM.loopSteps]; if (list) for (const e of list) bgmPlay(e, BGM.nextTime);
    BGM.nextTime += S; BGM.step++;
  }
}
function bgmStart(){
  bgmInit(); if (!BGM.ctx || BGM.playing) return;
  if (BGM.ctx.state==='suspended') BGM.ctx.resume();
  BGM.playing=true; BGM.nextTime=BGM.ctx.currentTime+0.05;   // 백그라운드 복귀 시 멈춘 지점(step)부터 이어서
  BGM.timer=setInterval(bgmSchedule, BGM.INTERVAL);
}
function bgmStop(){ if (BGM.timer) clearInterval(BGM.timer); BGM.timer=null; BGM.playing=false; }
function bgmApplyVolume(){ if (BGM.master) BGM.master.gain.setTargetAtTime(BGM.muted?0:BGM.volume, BGM.ctx.currentTime, 0.05); bgmRenderBtn(); }
async function bgmSavePrefs(){ try{ if(hasStorage()) await window.storage.set('bgm', JSON.stringify({volume:BGM.volume, muted:BGM.muted}), false); }catch{} }
async function bgmLoadPrefs(){ try{ if(!hasStorage()) return; const r=await window.storage.get('bgm',false); const v=JSON.parse(r.value); BGM.volume=v.volume??BGM.volume; BGM.muted=!!v.muted; bgmRenderBtn(); }catch{} }
window.bgmToggleMute = ()=>{ BGM.muted=!BGM.muted; if(!BGM.muted) bgmStart(); bgmApplyVolume(); bgmSavePrefs(); };
window.bgmSetVolume = v=>{ BGM.volume=v/100; if (BGM.muted && v>0){ BGM.muted=false; bgmStart(); } bgmApplyVolume(); bgmSavePrefs(); };
window.bgmTogglePanel = ()=>{ document.getElementById('bgmPanel').classList.toggle('open'); };
function bgmRenderBtn(){
  const b=document.getElementById('bgmBtn'); if(!b) return;
  b.textContent = BGM.muted||BGM.volume===0 ? '🔇' : BGM.volume<0.4 ? '🔉' : '🔊';
  const r=document.getElementById('bgmRange'); if (r) r.value=Math.round(BGM.volume*100);
  const m=document.getElementById('bgmMute'); if (m) m.textContent=BGM.muted?'소리 켜기':'음소거';
}
// 고정 UI (앱 화면과 별개로 body에 한 번만 생성 → 화면 전환과 무관하게 항상 표시)
const bgmUI=document.createElement('div'); bgmUI.className='bgm';
bgmUI.innerHTML=`<div id="bgmPanel" class="bgm-panel"><b>🎵 BGM 음량</b><input id="bgmRange" type="range" min="0" max="100" value="35" oninput="bgmSetVolume(+this.value)"><button id="bgmMute" class="btn sm light" onclick="bgmToggleMute()">음소거</button></div><button id="bgmBtn" class="bgm-btn" onclick="bgmTogglePanel()">🔊</button>`;
document.body.appendChild(bgmUI); bgmLoadPrefs();
// 첫 터치/클릭에 시작 (자동재생 정책). 패널을 열고 닫는 조작도 포함.
const bgmFirstGesture=()=>{ if(!BGM.muted) bgmStart(); document.removeEventListener('pointerdown',bgmFirstGesture); };
document.addEventListener('pointerdown', bgmFirstGesture);
document.addEventListener('visibilitychange', ()=>{ if(!BGM.ctx) return; if(document.hidden) bgmStop(); else if(!BGM.muted) bgmStart(); });
document.addEventListener('pointerdown', e=>{ const p=document.getElementById('bgmPanel'); if (p.classList.contains('open') && !e.target.closest('.bgm')) p.classList.remove('open'); });
/* =====================================================================
   10. 채팅 (월드 모드 전용) — 방 데이터의 chat 배열에 저장, 2초 폴링으로 수신.
       게임 행동 업로드와 겹치면 '채팅만 바뀐 충돌'은 자동으로 합친다(worldCommitTurn 참고).
   ===================================================================== */
const CHAT_MAX = 60, CHAT_LEN = 120, CHAT_QUICK = ['👍','😂','😭','🔥','🐪','ㅋㅋㅋ','굿','빨리요~'];
const chatUI=document.createElement('div'); chatUI.className='chat'; chatUI.style.display='none';
chatUI.innerHTML=`<div id="chatPanel" class="chat-panel">
    <div class="chat-head"><b>💬 채팅</b><button class="chat-close" onclick="chatToggle()">✕</button></div>
    <div id="chatList" class="chat-list"></div>
    <div class="chat-quick">${CHAT_QUICK.map(q=>`<button onclick="chatSend('${q}')">${q}</button>`).join('')}</div>
    <div class="chat-input"><input id="chatText" maxlength="${CHAT_LEN}" placeholder="메시지 입력…" onkeydown="if(event.key==='Enter'){chatSend();}"><button class="chat-send" onclick="chatSend()">보내기</button></div>
  </div>
  <button id="chatBtn" class="chat-btn" onclick="chatToggle()">💬<span id="chatBadge" class="chat-badge" style="display:none"></span></button>`;
document.body.appendChild(chatUI);
ui.chatOpen=false; ui.chatSeen=0; ui.chatQueue=[];
const fmtTime = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
window.chatToggle = ()=>{
  ui.chatOpen=!ui.chatOpen; document.getElementById('chatPanel').classList.toggle('open', ui.chatOpen);
  if (ui.chatOpen){ ui.chatSeen=(ui.room?.chat||[]).length; chatRender(); setTimeout(()=>{ const l=document.getElementById('chatList'); l.scrollTop=l.scrollHeight; document.getElementById('chatText').focus(); },50); }
  else chatRender();
};
function chatRender(){
  const show = isWorld() && ui.room && ['lobby','game','result'].includes(ui.screen);
  chatUI.style.display = show ? '' : 'none'; if (!show) return;
  const msgs=ui.room.chat||[], unread=Math.max(0, msgs.length-ui.chatSeen);
  const badge=document.getElementById('chatBadge'); badge.style.display = unread&&!ui.chatOpen ? '' : 'none'; badge.textContent = unread>9?'9+':unread;
  if (!ui.chatOpen) return;
  const list=document.getElementById('chatList'), atBottom = list.scrollHeight-list.scrollTop-list.clientHeight < 40;
  list.innerHTML = msgs.length ? msgs.map(m=>`<div class="msg ${m.from===ui.clientId?'me':''}"><div class="who">${m.from===ui.clientId?'나':esc(m.name)} <span>${fmtTime(m.ts)}</span></div><div class="bubble">${esc(m.text)}</div></div>`).join('')
    : `<div class="chat-empty">아직 메시지가 없어요. 가볍게 인사해 보세요 👋</div>`;
  if (atBottom || msgs.length!==ui.chatRenderedCount){ list.scrollTop=list.scrollHeight; }
  ui.chatRenderedCount=msgs.length; ui.chatSeen=msgs.length;
}
window.chatSend = async (preset)=>{
  const input=document.getElementById('chatText');
  const text=(preset ?? input.value).trim().slice(0,CHAT_LEN); if(!text||!ui.room) return;
  if (preset==null) input.value='';
  const me=ui.room.players.find(p=>p.clientId===ui.clientId);
  const msg={id:ui.clientId+'-'+Date.now(), from:ui.clientId, name:me?.name||ui.myName||'?', text, ts:Date.now()};
  ui.chatQueue.push(msg); chatFlush();
};
async function chatFlush(){
  if (ui.chatSending || !ui.chatQueue.length) return;
  if (ui.committing || ui.pendingResult) { setTimeout(chatFlush, 800); return; }   // 내 행동 업로드 중엔 잠시 대기
  ui.chatSending=true;
  const batch=ui.chatQueue.splice(0);
  try {
    // 낙관적 표시 → 최신본에 합쳐 저장 (실패 시 재시도)
    ui.room.chat=[...(ui.room.chat||[]), ...batch].slice(-CHAT_MAX); chatRender();
    for (let i=0;i<3;i++){
      try { await commit(r=>{ const have=new Set((r.chat||[]).map(m=>m.id)); const fresh=batch.filter(m=>!have.has(m.id)); r.chat=[...(r.chat||[]), ...fresh].slice(-CHAT_MAX); r.chatCount ||= {}; r.chatCount[ui.clientId]=(r.chatCount[ui.clientId]||0)+fresh.length; }); break; }
      catch(e){ if(i===2) throw e; await new Promise(r=>setTimeout(r,500)); }
    }
  } catch(e){ ui.syncErr='채팅 전송 실패'; }
  ui.chatSending=false; chatRender(); if (ui.chatQueue.length) chatFlush();
}
window.addEventListener('beforeunload', stopPoll);
/* iOS Safari는 viewport 설정을 무시하므로 핀치·더블탭 확대를 직접 막는다 (세로 스크롤은 유지) */
document.addEventListener('gesturestart', e=>e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e=>{ if (e.touches.length>1) e.preventDefault(); }, {passive:false});
let lastTap=0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if (now-lastTap<300 && e.target.tagName!=='INPUT') e.preventDefault(); lastTap=now; }, {passive:false});
render();
</script>
</body>
